<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seven Times Eight</title>
<meta name="description" content="7 × 8 = 56">
<meta name="author" content="Brendan Fahy">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="16x16">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    display: grid;
    place-items: center;
    height: 100dvh;
    font-family: Roboto, "Helvetica Neue", Arial, sans-serif;
    /* Two digits are about 1.1em wide and 0.72em tall: fit whichever runs out first. */
    font-size: min(115dvh, 80vw);
    line-height: 0.8;
  }
</style>
</head>
<body>56</body>
</html>
